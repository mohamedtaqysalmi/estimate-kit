name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal brief or command that triggers it. Do not include real client data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: estimate-kit version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: text
