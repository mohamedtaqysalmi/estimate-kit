[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estimate-kit"
version = "0.0.1"
description = "Turn a project brief into a task breakdown with estimate ranges, and force a human review before export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohamed-Taqy Salmi" }]
keywords = ["estimation", "project-planning", "cli", "freelance"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "build",
]

[project.urls]
Homepage = "https://mohamedtaqysalmi.github.io/estimate-kit/"
Repository = "https://github.com/mohamedtaqysalmi/estimate-kit"
Issues = "https://github.com/mohamedtaqysalmi/estimate-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/estimate_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=estimate_kit --cov-report=term-missing"

[tool.coverage.run]
source = ["estimate_kit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
